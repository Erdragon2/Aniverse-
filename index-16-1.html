var ART_C = {};
function artUrl(title){
  title = String(title || '?');
  if(ART_C[title]) return ART_C[title];
  var l = title.toLowerCase(), K = null, i, h = 0;
  for(i = 0; i < ART_T.length; i++) if(ART_T[i][0].test(l)){ K = ART_T[i]; break; }
  for(i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) >>> 0;
  var hue = h % 360, m;
  if(!K){ m = ['rings', 'beams', 'diamond', 'star', 'swirl'][h % 5]; K = [null, 'hsl(' + hue + ',55%,38%)', 'hsl(' + ((hue + 40) % 360) + ',60%,16%)', 'hsl(' + ((hue + 180) % 360) + ',75%,68%)', m]; }
  var words = title.split(/\s+/), lines = [], cur = '';
  words.forEach(function(w){ if((cur + ' ' + w).trim().length > 13 && cur){ lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  if(cur) lines.push(cur);
  if(lines.length > 4){ lines = lines.slice(0, 4); lines[3] = lines[3].slice(0, 11) + '…'; }
  var x = function(t){ return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var y0 = 288 - (lines.length - 1) * 19;
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><defs><linearGradient id="g" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="' + K[1] + '"/><stop offset="1" stop-color="' + K[2] + '"/></linearGradient><linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></linearGradient></defs>' +
    '<rect width="200" height="300" fill="url(#g)"/>' + artMotif(K[4], K[3]) + '<rect width="200" height="300" fill="url(#v)"/>' +
    lines.map(function(t, j){ return '<text x="100" y="' + (y0 + j * 19) + '" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="16" fill="#fff" stroke="#000" stroke-opacity=".35" stroke-width="3" paint-order="stroke">' + x(t) + '</text>'; }).join('') + '</svg>';
  var url = '#111 url(data:image/svg+xml,' + encodeURIComponent(svg).replace(/[()']/g, function(c){ return '%' + c.charCodeAt(0).toString(16).toUpperCase(); }) + ') center/cover no-repeat';
  ART_C[title] = url; return url;
}

<div id="authWall" class="boot">
  <div class="abox">

    <div class="atabs" role="tablist">
      <button type="button" role="tab" id="aTabIn" aria-selected="true">Accedi</button>

<script>
(function(){
  var K_SES = 'aniverse-session';
  var wall = document.getElementById('authWall'), mode = 'in';
  var $ = function(i){ return document.getElementById(i); };
  function hash(pw, salt){
    var data = new TextEncoder().encode(salt + ':' + pw);
    if(window.crypto && crypto.subtle) return crypto.subtle.digest('SHA-256', data).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    });
    var h = 5381; for(var i = 0; i < data.length; i++) h = ((h << 5) + h + data[i]) | 0;
    return Promise.resolve('x' + h);
  }
  function setMode(m){
    mode = m;
    $('aTabIn').setAttribute('aria-selected', m === 'in'); $('aTabUp').setAttribute('aria-selected', m === 'up');
    $('aPass2').hidden = $('aMail').hidden = m === 'in'; $('aUser').placeholder = m === 'in' ? 'Username o email' : 'Username'; $('aUser').maxLength = m === 'in' ? 100 : 24; $('aGo').textContent = m === 'in' ? 'Accedi' : 'Crea account';
    $('aPass').autocomplete = m === 'in' ? 'current-password' : 'new-password'; $('aErr').textContent = '';
  }
  function show(){ setMode(getAccounts().length ? 'in' : 'up'); wall.hidden = false; wall.classList.remove('boot'); document.body.style.overflow = 'hidden'; }
  function hide(){ wall.hidden = true; wall.classList.remove('boot'); document.body.style.overflow = ''; $('aPass').value = $('aPass2').value = ''; }
  function err(t){ $('aErr').textContent = t; }
  /* cambio utente: salvo lo stato di quello attuale, poi ricarico così ognuno legge solo i propri dati */
  function switchTo(id){
    try{ flushAll(); }catch(e){}
    window.__wiping = true;
    STORE.set(K_SES, id || '', true);
    setTimeout(function(){ location.replace(location.href.split('#')[0]); }, 200);
  }
  function go(){
    var u = $('aUser').value.trim(), pw = $('aPass').value, accs = getAccounts();
    if(u.length < 3){ return err('Username: almeno 3 caratteri'); }
    var mail = $('aMail').value.trim().toLowerCase();

      hash(pw, a.salt).then(function(h){

    }

  $('aTabUp').onclick = function(){ setMode('up'); };
  $('aGo').onclick = go;
  wall.addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); });

  var decided = false;
  window.__authCheck = function(){ if(decided) return; decided = true; var ses = STORE.get(K_SES, true); if(ses && findAccount(ses)) hide(); else show(); };
})();
